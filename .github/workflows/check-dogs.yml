name: Check for new dogs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dog-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check the page
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NOTIFY_ON_REMOVALS: "false"
        run: python monitor.py

      - name: Save state
        run: |
          git config user.name "dog-monitor-bot"
          git config user.email "dog-monitor-bot@users.noreply.github.com"
          git add -A state.json snapshot.txt 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update dog list" && git push)
